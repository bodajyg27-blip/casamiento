<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julieta & Gabriel — Galería de fotos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

  @font-face {
    font-family: 'Edwardian Script ITC';
    src: url('../fonts/Edwardian.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --olive: #4b5320;
    --olive-dark: #3a4118;
    --cream: #f9f8ec;
    --bg: #eeecd4;
    --border: #ddd9ae;
    --muted: #8a8757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    font-family: 'Cormorant Garamond', serif;
    color: #3f3e28;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  /* ---------- Header ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--olive);
    color: var(--cream);
    padding: max(16px, env(safe-area-inset-top)) 18px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.14);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
    text-decoration: none;
  }
  .icon-btn:active { background: rgba(255,255,255,0.28); }
  .icon-btn svg { width: 18px; height: 18px; }
  .topbar-title { flex: 1; min-width: 0; }
  .topbar-title .kicker { font-style: italic; font-size: 14px; opacity: 0.85; line-height: 1; }
  .topbar-title h1 {
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .count-badge {
    background: rgba(255,255,255,0.16);
    color: var(--cream);
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .content {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 14px calc(100px + env(safe-area-inset-bottom));
  }
  .intro { text-align: center; color: var(--muted); font-size: 17px; margin-bottom: 18px; }

  /* ---------- Grid ---------- */

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .gallery-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, #ece9cf 30%, #f5f3e2 50%, #ece9cf 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    cursor: pointer;
  }
  .gallery-item.loaded { animation: none; background: #f2f1de; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .gallery-item img.ready { opacity: 1; }

  .state-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 50px 10px;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .state-msg svg { width: 42px; height: 42px; color: var(--border); }

  /* ---------- FAB ---------- */

  .fab {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--olive);
    color: var(--cream);
    border: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .fab:active { background: var(--olive-dark); transform: scale(0.94); }
  .fab svg { width: 26px; height: 26px; }
  .fab.busy svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .upload-pill {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(92px + env(safe-area-inset-bottom));
    background: #2e2c18;
    color: var(--cream);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 10;
  }
  .upload-pill.show { opacity: 1; transform: translateY(0); }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,9,2,0.94);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: min(92vw, 900px);
    max-height: 78vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox-top {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    left: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lightbox-counter { color: var(--cream); font-size: 15px; opacity: 0.85; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--cream);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox-nav:active { background: rgba(255,255,255,0.24); }
  .lightbox-nav svg { width: 20px; height: 20px; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-bottom {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }
  .lightbox-download {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    color: var(--olive);
    padding: 11px 22px;
    border-radius: 30px;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .lightbox-download svg { width: 17px; height: 17px; }
  .lightbox-spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--cream);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: #2e2c18;
    color: var(--cream);
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="topbar">
    <a class="icon-btn" href="../index.html" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title">
      <span class="kicker">Julieta &amp; Gabriel</span>
      <h1>Galería</h1>
    </div>
    <span class="count-badge hidden" id="count-badge">0</span>
  </div>

  <div class="content">
    <p class="intro">Subí tus fotos y mirá las que van subiendo los demás invitados</p>
    <div class="gallery-grid" id="galleryGrid">
      <div class="state-msg">
        <div class="lightbox-spinner" style="border-color:var(--border); border-top-color:var(--olive);"></div>
        <span>Cargando fotos...</span>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
  <div class="upload-pill" id="uploadPill"></div>
  <button class="fab" id="uploadBtn" aria-label="Subir fotos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-top">
      <span class="lightbox-counter" id="lightbox-counter"></span>
      <button class="icon-btn" id="lightbox-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img id="lightbox-img" alt="Foto del casamiento">
    <div class="lightbox-spinner hidden" id="lightbox-spinner"></div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lightbox-bottom">
      <button class="lightbox-download" id="lightbox-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-sc2l5jW1oMN6Dkr-s3gduTSbTTlL2gRiPlw_khEQ6GzTCkJHlnqpgvrvD0b2sBOo/exec";
  const MAX_DIM = 1600;

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  const countBadge = document.getElementById('count-badge');
  let fotosCache = [];

  async function loadGaleria() {
    const grid = document.getElementById('galleryGrid');
    try {
      const res = await fetch(GAS_URL + "?tipo=galeria");
      const fotos = await res.json();
      fotosCache = fotos;
      if (!fotos.length) {
        grid.innerHTML = `<div class="state-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Todavía no hay fotos. ¡Subí la primera!</span>
        </div>`;
        countBadge.classList.add('hidden');
        return;
      }
      countBadge.textContent = fotos.length;
      countBadge.classList.remove('hidden');
      grid.innerHTML = fotos.map((f, i) => `
        <div class="gallery-item" data-index="${i}">
          <img data-src="${f.url}" alt="Foto del casamiento">
        </div>
      `).join('');
      grid.querySelectorAll('.gallery-item').forEach(el => {
        const img = el.querySelector('img');
        loadFotoInto(img, el);
        el.addEventListener('click', () => openLightbox(Number(el.dataset.index)));
      });
    } catch (err) {
      grid.innerHTML = `<div class="state-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>No se pudieron cargar las fotos. Reintentá más tarde.</span>
      </div>`;
    }
  }
  loadGaleria();

  async function loadFotoInto(imgEl, itemEl) {
    try {
      const res = await fetch(imgEl.dataset.src);
      const data = await res.json();
      imgEl.src = 'data:' + data.mimeType + ';base64,' + data.data;
      imgEl.classList.add('ready');
      itemEl.classList.add('loaded');
    } catch (err) {
      console.error('No se pudo cargar una foto', err);
    }
  }

  // ---------- Lightbox ----------

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxSpinner = document.getElementById('lightbox-spinner');
  const lightboxCounter = document.getElementById('lightbox-counter');
  let lightboxIndex = 0;

  function openLightbox(index) {
    lightboxIndex = index;
    lightbox.classList.add('open');
    showLightboxPhoto();
  }

  function showLightboxPhoto() {
    const foto = fotosCache[lightboxIndex];
    lightboxCounter.textContent = `${lightboxIndex + 1} / ${fotosCache.length}`;
    lightboxImg.classList.add('hidden');
    lightboxSpinner.classList.remove('hidden');
    const loadedImg = document.querySelector(`.gallery-item[data-index="${lightboxIndex}"] img.ready`);
    if (loadedImg) {
      lightboxImg.src = loadedImg.src;
      lightboxImg.classList.remove('hidden');
      lightboxSpinner.classList.add('hidden');
    } else {
      fetch(foto.url).then(r => r.json()).then(data => {
        lightboxImg.src = 'data:' + data.mimeType + ';base64,' + data.data;
        lightboxImg.classList.remove('hidden');
        lightboxSpinner.classList.add('hidden');
      });
    }
  }

  function closeLightbox() { lightbox.classList.remove('open'); }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.getElementById('lightbox-prev').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex - 1 + fotosCache.length) % fotosCache.length;
    showLightboxPhoto();
  });
  document.getElementById('lightbox-next').addEventListener('click', () => {
    lightboxIndex = (lightboxIndex + 1) % fotosCache.length;
    showLightboxPhoto();
  });
  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
    if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
  });

  document.getElementById('lightbox-download').addEventListener('click', () => {
    downloadFoto(fotosCache[lightboxIndex].id);
  });

  async function downloadFoto(id) {
    try {
      const res = await fetch(GAS_URL + "?tipo=foto&id=" + id);
      const data = await res.json();
      const link = document.createElement('a');
      link.href = 'data:' + data.mimeType + ';base64,' + data.data;
      link.download = 'foto-casamiento.jpg';
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch (err) {
      showToast('No se pudo descargar la foto');
    }
  }

  // ---------- Subida ----------

  function resizeImage(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            } else {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
  }

  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!files.length) return;

    const input = document.getElementById('photoInput');
    const btn = document.getElementById('uploadBtn');
    const pill = document.getElementById('uploadPill');
    btn.disabled = true;
    btn.classList.add('busy');
    pill.classList.add('show');

    let ok = 0;
    for (let i = 0; i < files.length; i++) {
      pill.textContent = `Subiendo ${i + 1} de ${files.length}...`;
      try {
        const resized = await resizeImage(files[i], MAX_DIM);
        const base64 = await blobToBase64(resized);
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ tipo: 'foto', nombre: files[i].name, mimeType: 'image/jpeg', data: base64 })
        });
        const data = await res.json();
        if (data.success) ok++;
      } catch (err) {
        console.error('Error subiendo foto', err);
      }
    }

    pill.classList.remove('show');
    btn.disabled = false;
    btn.classList.remove('busy');
    input.value = '';

    if (ok > 0) {
      showToast(`📸 ${ok} foto${ok > 1 ? 's' : ''} subida${ok > 1 ? 's' : ''}`);
      loadGaleria();
    } else {
      showToast('No se pudo subir la foto, reintentá');
    }
  }

  document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', (e) => handleFiles(e.target.files));
</script>
</body>
</html>
