<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julieta & Gabriel — Galería de fotos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Special+Elite&display=swap');

  @font-face {
    font-family: 'Edwardian Script ITC';
    src: url('../fonts/Edwardian.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --olive: #4b5320;
    --olive-dark: #3a4118;
    --cream: #f9f8ec;
    --bg: #f1efe9;
    --border: #ddd9ae;
    --muted: #8a8757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    font-family: 'Cormorant Garamond', serif;
    color: #3f3e28;
    -webkit-font-smoothing: antialiased;
  }

  /* Mismo fondo claro con marco en relieve que la invitación, fijo detrás
     de todo (un pseudo-elemento en vez de background-attachment: fixed,
     que en iOS se ve a los saltos). Las fotos pasan por encima. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--bg) url('../img/fondoblancohorizontal.webp') center / cover no-repeat;
  }

  .hidden { display: none !important; }

  /* ---------- Header ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(244,242,236,0.94);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #55543a;
    padding: max(12px, env(safe-area-inset-top)) 18px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(75,83,32,0.06);
  }
  /* Barra clara: el botón pasa a contorno oliva. El de cerrar del
     lightbox (fondo oscuro) conserva el .icon-btn original. */
  .topbar .icon-btn {
    background: none;
    border: 1px solid rgba(85,84,58,0.45);
    color: var(--olive);
  }
  .topbar .icon-btn:active { background: rgba(75,83,32,0.1); }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.14);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
    text-decoration: none;
  }
  .icon-btn:active { background: rgba(255,255,255,0.28); }
  .icon-btn svg { width: 18px; height: 18px; }
  .topbar-title { flex: 1; min-width: 0; }
  /* Tipografías de la invitación: Edwardian para los nombres, Special
     Elite (máquina de escribir) para títulos y textos de interfaz. */
  .topbar-title .kicker {
    display: block;
    font-family: 'Edwardian Script ITC', cursive;
    font-size: 30px;
    line-height: 1;
    color: var(--olive);
    white-space: nowrap;
  }
  .topbar-title h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    font-weight: normal;
    color: #6b6a45;
    margin-top: 3px;
  }
  .count-badge {
    font-family: 'Special Elite', 'Courier New', monospace;
    border: 1px solid rgba(85,84,58,0.45);
    color: var(--olive);
    font-size: 14px;
    padding: 6px 12px 3px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .content {
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 10px calc(100px + env(safe-area-inset-bottom));
  }
  .intro {
    font-family: 'Special Elite', 'Courier New', monospace;
    text-align: center;
    color: #6b6a45;
    font-size: 13px;
    letter-spacing: 1.5px;
    line-height: 1.7;
    text-transform: uppercase;
    margin: 6px auto 20px;
    max-width: 520px;
  }

  /* ---------- Masonry (estilo Pinterest) ---------- */

  .masonry {
    column-count: 2;
    column-gap: 8px;
  }
  @media (min-width: 560px)  { .masonry { column-count: 3; } }
  @media (min-width: 860px)  { .masonry { column-count: 4; } }
  @media (min-width: 1180px) { .masonry { column-count: 5; } }
  @media (min-width: 1500px) { .masonry { column-count: 6; } }

  .pin {
    break-inside: avoid;
    margin-bottom: 8px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, #e8e5db 30%, #f5f3ee 50%, #e8e5db 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    cursor: pointer;
    min-height: 160px;
  }
  .pin:nth-child(3n)   { min-height: 220px; }
  .pin:nth-child(5n+1) { min-height: 280px; }
  .pin.loaded { animation: none; background: #efede6; min-height: 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .pin img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .pin img.ready { opacity: 1; }
  /* Formas de tarjeta (ver formaDePin()). "natural" no recorta. */
  .pin[data-forma="cuadrada"] img,
  .pin[data-forma="alta"] img,
  .pin[data-forma="media"] img,
  .pin[data-forma="apaisada"] img { object-fit: cover; }
  .pin[data-forma="cuadrada"] img { aspect-ratio: 1 / 1; }
  .pin[data-forma="alta"] img { aspect-ratio: 2 / 3; }
  .pin[data-forma="media"] img { aspect-ratio: 4 / 5; }
  .pin[data-forma="apaisada"] img { aspect-ratio: 4 / 3; }

  #scrollSentinel { height: 1px; }

  .state-msg {
    text-align: center;
    color: var(--muted);
    font-family: 'Special Elite', 'Courier New', monospace;
    padding: 50px 16px;
    font-size: 15px;
    line-height: 1.7;
    letter-spacing: 0.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .state-msg svg { width: 42px; height: 42px; color: #9c9a52; }

  /* ---------- FAB ---------- */

  .fab {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--olive);
    color: var(--cream);
    border: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .fab:active { background: var(--olive-dark); transform: scale(0.94); }
  .fab svg { width: 26px; height: 26px; }
  .fab.busy svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fab-upload {
    bottom: calc(110px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
  }
  .fab-upload.solo {
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
  }

  .fab-camera {
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    width: 78px;
    height: 78px;
  }
  .fab-camera svg { width: 34px; height: 34px; }

  .upload-pill {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(178px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    background: #2e2c18;
    color: var(--cream);
    font-family: 'Special Elite', 'Courier New', monospace;
    padding: 10px 16px 7px;
    border-radius: 20px;
    font-size: 13px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 10;
  }
  .upload-pill.show { opacity: 1; transform: translateY(0); }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,9,2,0.94);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: min(92vw, 900px);
    max-height: 78vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox-top {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    left: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lightbox-counter { font-family: 'Special Elite', 'Courier New', monospace; color: var(--cream); font-size: 14px; letter-spacing: 2px; opacity: 0.85; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--cream);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox-nav:active { background: rgba(255,255,255,0.24); }
  .lightbox-nav svg { width: 20px; height: 20px; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-bottom {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }
  .lightbox-download {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    color: var(--olive);
    padding: 11px 22px;
    border-radius: 30px;
    border: none;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding-top: 13px;
    cursor: pointer;
  }
  .lightbox-download svg { width: 17px; height: 17px; }
  .lightbox-spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--cream);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    transform: translateX(-50%) translateY(20px);
    background: #2e2c18;
    color: var(--cream);
    font-family: 'Special Elite', 'Courier New', monospace;
    padding: 13px 22px 10px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="topbar">
    <a class="icon-btn" href="../index.html" id="backLink" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title">
      <span class="kicker">Julieta &amp; Gabriel</span>
      <h1>Galería de fotos</h1>
    </div>
    <span class="count-badge hidden" id="count-badge">0</span>
  </div>

  <div class="content">
    <p class="intro">Subí tus fotos y mirá las que van subiendo los demás invitados</p>
    <div class="state-msg hidden" id="stateMsg"></div>
    <div class="masonry" id="masonryGrid"></div>
    <div id="scrollSentinel"></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
  <div class="upload-pill" id="uploadPill"></div>
  <button class="fab fab-camera" id="cameraBtn" aria-label="Sacar foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <button class="fab fab-upload" id="uploadBtn" aria-label="Subir fotos desde la galería">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  </button>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-top">
      <span class="lightbox-counter" id="lightbox-counter"></span>
      <button class="icon-btn" id="lightbox-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img id="lightbox-img" alt="Foto del casamiento">
    <div class="lightbox-spinner hidden" id="lightbox-spinner"></div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lightbox-bottom">
      <button class="lightbox-download" id="lightbox-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxC-pfS4VL6-8teZ8T3Pt5cXYdHQIrkn5gslkQ6HcKk6qQmlMVVL8Cz5HWzsuM6ExMN/exec";
  // Fotos: Worker de Cloudflare con R2 (ver worker/src/index.js). Apps
  // Script queda solo para la visibilidad de la galería.
  const MEDIA_URL = "https://boda-media.bodajyg.workers.dev";
  // ---------- Log de depuración ----------
  // Siempre va a la consola; con ?debug=1 en la URL además se muestra en un
  // panel al pie de la pantalla (con botón para copiarlo), pensado para ver
  // en el celular por qué no se sube una foto sin abrir las herramientas
  // del navegador.
  const DEBUG = /[?&]debug=1\b/.test(location.search);
  const logLineas = [];
  let logPanel = null;

  function log(...partes) {
    const hora = new Date().toLocaleTimeString('es-AR', { hourCycle: 'h23' });
    const linea = hora + ' ' + partes.map(p => {
      if (p instanceof Error) return p.name + ': ' + p.message;
      if (p && typeof p === 'object') { try { return JSON.stringify(p); } catch (e) { return String(p); } }
      return String(p);
    }).join(' ');
    logLineas.push(linea);
    if (logLineas.length > 300) logLineas.shift();
    console.log('[galeria]', ...partes);
    if (DEBUG) pintarLog();
  }

  function pintarLog() {
    if (!logPanel) {
      logPanel = document.createElement('div');
      logPanel.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(20,20,10,.92);color:#d8f0a0;font:11px/1.4 ui-monospace,Menlo,monospace;max-height:42vh;display:flex;flex-direction:column';
      logPanel.innerHTML = '<div style="display:flex;gap:8px;padding:6px 8px;border-bottom:1px solid #555"><b style="flex:1">Log (debug)</b><button id="logCopiar">Copiar</button><button id="logCerrar">Cerrar</button></div><pre id="logTexto" style="margin:0;padding:6px 8px;overflow:auto;white-space:pre-wrap;word-break:break-all"></pre>';
      document.body.appendChild(logPanel);
      logPanel.querySelector('#logCopiar').onclick = () => {
        const texto = logLineas.join('\n');
        (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(
          () => showToast('Log copiado'), () => showToast('No se pudo copiar el log'));
      };
      logPanel.querySelector('#logCerrar').onclick = () => { logPanel.remove(); logPanel = null; };
    }
    const pre = logPanel.querySelector('#logTexto');
    pre.textContent = logLineas.join('\n');
    pre.scrollTop = pre.scrollHeight;
  }

  window.addEventListener('error', e => log('ERROR de la página:', e.message, (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => log('Promesa sin atrapar:', e.reason));
  log('Galería abierta · https:', location.protocol === 'https:', '· crypto.subtle:', !!(window.crypto && crypto.subtle), '· online:', navigator.onLine);

  const MAX_DIM = 1600;
  const THUMB_DIM = 600;   // miniatura para la grilla (la foto completa se ve al tocarla)
  const PAGE_SIZE = 16;

  // Safari en iOS reserva una barra de navegación pegada abajo que
  // aparece/desaparece con el scroll. env(safe-area-inset-bottom) no la
  // contempla (solo el "home indicator"), así que los botones flotantes
  // (position: fixed) pueden terminar tapados detrás de esa barra. Acá se
  // mide la diferencia entre el alto real de la ventana y el del visual
  // viewport (lo que Safari realmente muestra) y se empuja todo lo fijo
  // hacia arriba esa diferencia mediante la variable CSS --vv-gap.
  (function ajustarBotonesSobreBarraDeSafari() {
    if (!window.visualViewport) return;
    const raiz = document.documentElement;
    function actualizar() {
      const gap = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
      raiz.style.setProperty('--vv-gap', Math.max(0, Math.round(gap)) + 'px');
    }
    window.visualViewport.addEventListener('resize', actualizar);
    window.visualViewport.addEventListener('scroll', actualizar);
    actualizar();
  })();

  // Si se llegó navegando desde otra página del sitio (invitacion/,
  // etc.), "Volver" usa el historial del navegador para
  // regresar exactamente ahí. Si no hay de dónde volver (URL pegada
  // directo, o vino de otro sitio), cae al ../index.html normal.
  document.getElementById('backLink').addEventListener('click', (e) => {
    if (document.referrer && document.referrer.startsWith(location.origin) && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  const countBadge = document.getElementById('count-badge');
  let fotosCache = [];       // fotos ya traídas del backend (crece de a páginas)
  let totalFotos = 0;        // total real informado por el backend (puede ser > fotosCache.length)
  let paginaSiguiente = 0;
  let cargandoPagina = false;
  let scrollObserver = null;
  let unloadObserver = null;

  // ---------- Freno global de reintentos ----------
  // Si fallan muchas fotos casi juntas (cupo agotado, bloqueo de Google,
  // etc.), NO conviene que cada una reintente sola — eso genera una
  // ráfaga sincronizada de pedidos automáticos contra el mismo recurso
  // caído, que es justo el patrón que hace que un bloqueo temporal se
  // mantenga o empeore. Este contador corta todos los reintentos por un
  // buen rato apenas se detecta ese patrón.
  let fallosRecientes = 0;
  let ultimoReinicioFallos = 0;
  let pausaGlobalHasta = 0;
  function registrarFalloYCalcularEspera(intentos) {
    const ahora = Date.now();
    if (ahora - ultimoReinicioFallos > 10000) {
      fallosRecientes = 0;
      ultimoReinicioFallos = ahora;
    }
    fallosRecientes++;
    if (fallosRecientes > 6) {
      pausaGlobalHasta = ahora + 3 * 60 * 1000; // 3 minutos sin insistir
    }
    const base = Math.min(2000 * 2 ** intentos, 30000);
    const conJitter = base * (0.5 + Math.random()); // 0.5x-1.5x: no todas caen a la vez
    return Math.max(conJitter, pausaGlobalHasta - ahora);
  }

  // ---------- Pedidos a Apps Script con reintentos ----------
  // Apps Script atiende ~30 ejecuciones a la vez: si muchos invitados
  // abren la galería juntos, algunos pedidos fallan. En vez de mostrar
  // un error al primer intento, se reintenta con esperas crecientes y
  // aleatorias (para que no vuelvan a caer todos en el mismo instante).
  // Devuelve null si se agotaron los intentos.
  async function pedirJson(url, intentos) {
    for (let i = 0; i < intentos; i++) {
      try {
        const res = await fetch(url);
        return await res.json();
      } catch (err) {
        if (i === intentos - 1) console.error('Pedido fallido tras reintentos', url, err);
      }
      if (i < intentos - 1) {
        await new Promise(r => setTimeout(r, 1500 * 2 ** i * (0.5 + Math.random())));
      }
    }
    return null;
  }

  // Si no se puede confirmar si la galería está visible, se usa el último
  // estado conocido en este dispositivo (y si nunca se supo, NO se
  // muestran las fotos: se espera y se reintenta) — así una falla de la
  // consulta no revela la galería antes de tiempo.
  async function consultarGaleriaVisible() {
    const data = await pedirJson(GAS_URL + "?tipo=galeriaVisible", 3);
    if (data && typeof data.visible === 'boolean') {
      try { localStorage.setItem('galeriaVisible', String(data.visible)); } catch (err) {}
      return data.visible;
    }
    try {
      const guardado = localStorage.getItem('galeriaVisible');
      if (guardado === 'true') return true;
      if (guardado === 'false') return false;
    } catch (err) {}
    return null;
  }

  let generacionGaleria = 0;   // cambia en cada loadGaleria(): descarta respuestas viejas
  let idsEnGrilla = new Set(); // evita repetir una foto si el listado se corre entre tandas
  let finGaleria = false;      // el servidor ya devolvió una tanda vacía

  // Fotos que este dispositivo acaba de subir. El Worker guarda el
  // listado unos segundos en memoria (no lo invalida con cada subida, para
  // no listar R2 todo el tiempo durante la fiesta), así que la
  // foto recién subida puede tardar en aparecer en el listado: mientras
  // tanto se le muestra a quien la subió desde su propia copia local.
  const MIS_SUBIDAS_MAX_MS = 5 * 60 * 1000;
  let misSubidas = [];         // [{ id, directo, thumb, ts }] con object URLs

  function registrarSubidaPropia(idServidor, record) {
    if (!idServidor) return;
    const directo = URL.createObjectURL(record.blob);
    const thumb = record.thumb ? URL.createObjectURL(record.thumb) : null;
    misSubidas.unshift({ id: idServidor, directo, thumb, ts: Date.now() });
  }

  // Devuelve las subidas propias que el servidor todavía no lista y
  // descarta (liberando memoria) las que ya aparecen o son viejas.
  function subidasPropiasPendientes(fotosServidor) {
    const enServidor = new Set(fotosServidor.map(f => f.id));
    const ahora = Date.now();
    const vigentes = [];
    misSubidas.forEach(m => {
      if (enServidor.has(m.id) || ahora - m.ts > MIS_SUBIDAS_MAX_MS) {
        URL.revokeObjectURL(m.directo);
        if (m.thumb) URL.revokeObjectURL(m.thumb);
      } else {
        vigentes.push(m);
      }
    });
    misSubidas = vigentes;
    return vigentes.map(m => ({ id: m.id, directo: m.directo, thumb: m.thumb }));
  }
  let reintentoGaleria = null;

  async function loadGaleria() {
    const generacion = ++generacionGaleria;
    clearTimeout(reintentoGaleria);
    const stateMsg = document.getElementById('stateMsg');
    const grid = document.getElementById('masonryGrid');
    const sentinel = document.getElementById('scrollSentinel');
    const intro = document.querySelector('.intro');

    function showState(html) {
      stateMsg.innerHTML = html;
      stateMsg.classList.remove('hidden');
      grid.classList.add('hidden');
      sentinel.classList.add('hidden');
    }
    function showGrid() {
      stateMsg.classList.add('hidden');
      grid.classList.remove('hidden');
      sentinel.classList.remove('hidden');
    }

    // Estado de error con reintento automático: nadie tiene que recargar
    // la página a mano.
    function mostrarErrorYReintentar() {
      showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>No se pudieron cargar las fotos. Reintentando en unos segundos…</span>`);
      reintentoGaleria = setTimeout(loadGaleria, 15000 + Math.random() * 10000);
    }

    const visible = await consultarGaleriaVisible();
    if (generacion !== generacionGaleria) return;
    if (visible === false) {
      intro.classList.add('hidden');
        showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          <span>Seguí compartiendo tu enfoque sobre esta noche, mañana se revelará cada recuerdo subido por nuestros invitados.</span>`);
      countBadge.classList.add('hidden');
      fotosCache = [];
      totalFotos = 0;
      return;
    }
    if (visible === null) {
      mostrarErrorYReintentar();
      return;
    }
    intro.classList.remove('hidden');

    if (scrollObserver) scrollObserver.disconnect();
    if (unloadObserver) unloadObserver.disconnect();
    grid.innerHTML = '';
    fotosCache = [];
    totalFotos = 0;
    paginaSiguiente = 0;
    idsEnGrilla = new Set();
    finGaleria = false;

    const primeraPagina = await pedirPagina(0);
    if (generacion !== generacionGaleria) return;
    if (primeraPagina === null) {
      mostrarErrorYReintentar();
      return;
    }
    const propias = subidasPropiasPendientes(primeraPagina.fotos);
    if (!primeraPagina.total && !propias.length) {
      showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Todavía no hay fotos. ¡Subí la primera!</span>`);
      countBadge.classList.add('hidden');
      return;
    }

    totalFotos = primeraPagina.total + propias.length;
    paginaSiguiente = 1;
    countBadge.textContent = totalFotos;
    countBadge.classList.remove('hidden');
    showGrid();
    setupObservers();
    agregarFotosAlGrid(propias.concat(primeraPagina.fotos));
  }
  loadGaleria();

  // ---------- Scroll infinito + lazy loading + liberación de memoria ----------
  // Cada tanda de fotos se pide paginada al backend (liviano: solo
  // metadata) cuando el sentinel al pie de la grilla entra en pantalla.
  // Las <img> apuntan directo al Worker (foto.thumb / foto.directo).
  // El mismo observer, cuando una
  // foto ya cargada queda muy lejos por arriba del scroll, le limpia el
  // src para no acumular miles de imágenes decodificadas en memoria; si
  // el usuario vuelve a subir, se vuelve a pedir sola.

  async function pedirPagina(pagina) {
    const data = await pedirJson(MEDIA_URL + `/fotos?pagina=${pagina}&porPagina=${PAGE_SIZE}`, 4);
    return (data && Array.isArray(data.fotos)) ? data : null;
  }

  function setupObservers() {
    scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) renderNextPage();
      });
    }, { rootMargin: '600px 0px' });
    scrollObserver.observe(document.getElementById('scrollSentinel'));

    // rootMargin asimétrico: expande 600px hacia abajo (precarga antes de
    // que se note el salto) y 1500px hacia arriba (recién libera memoria
    // cuando quedó bastante lejos, no apenas sale de pantalla).
    unloadObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const pin = entry.target;
        const img = pin.querySelector('img');
        if (!img) return;
        if (entry.isIntersecting) {
          if (!img.src && img.dataset.src) img.src = img.dataset.src;
          return;
        }
        // No intersecta: solo nos importa "se fue por arriba, lejos" —
        // abajo no hay nada cargado todavía que valga la pena liberar.
        if (entry.boundingClientRect.bottom >= -1500) return;
        if (img.src) {
          pin.style.minHeight = entry.boundingClientRect.height + 'px';
          pin.classList.remove('loaded');
          img.removeAttribute('src');
          img.classList.remove('ready');
        }
      });
    }, { rootMargin: '1500px 0px 600px 0px' });
  }

  // paginaSiguiente recién avanza cuando la tanda llegó bien: si falla
  // (incluso tras los reintentos de pedirJson) NO se saltea — se vuelve a
  // pedir la misma un rato después, porque el sentinel puede seguir en
  // pantalla y el observer no vuelve a disparar solo.
  async function renderNextPage() {
    if (cargandoPagina || finGaleria || fotosCache.length >= totalFotos) return;
    cargandoPagina = true;
    const generacion = generacionGaleria;
    const data = await pedirPagina(paginaSiguiente);
    cargandoPagina = false;
    if (generacion !== generacionGaleria) return;
    if (!data) {
      setTimeout(renderNextPage, 8000 + Math.random() * 6000);
      return;
    }
    paginaSiguiente++;
    if (!data.fotos.length) { finGaleria = true; return; }
    agregarFotosAlGrid(data.fotos);
    // El observer solo dispara cuando el sentinel ENTRA en pantalla: si
    // la tanda nueva no alcanzó a empujarlo fuera (pantalla alta, fotos
    // chicas), hay que pedir la siguiente a mano.
    setTimeout(() => {
      const r = document.getElementById('scrollSentinel').getBoundingClientRect();
      if (r.top < window.innerHeight + 600) renderNextPage();
    }, 300);
  }

  // ---------- Rutas de cada foto ----------
  // En la grilla se prueba primero la miniatura y, si falla, la original.
  // Las fotos recién subidas desde este dispositivo (blob:) solo tienen
  // su copia local.
  function rutasDeFoto(foto, conMiniatura) {
    if (String(foto.directo).startsWith('blob:')) return [conMiniatura && foto.thumb ? foto.thumb : foto.directo];
    return (conMiniatura && foto.thumb) ? [foto.thumb, foto.directo] : [foto.directo];
  }

  // Estilo Pinterest aunque todas las fotos tengan la misma proporción
  // (p. ej. una tanda de verticales del mismo celular): algunas tarjetas
  // recortan la foto a otra forma. La forma sale del id de la foto y no de
  // su posición: con CSS columns un patrón por posición se repite igual en
  // cada columna y las filas quedan alineadas. Así cada foto tiene siempre
  // la misma forma. Las horizontales casi no se recortan. En el lightbox
  // se ve completa.
  const FORMAS_VERTICAL = ['natural', 'cuadrada', 'alta', 'media', 'natural', 'alta', 'cuadrada'];
  const FORMAS_HORIZONTAL = ['natural', 'apaisada'];

  function formaDePin(id, ancho, alto) {
    const formas = alto > ancho ? FORMAS_VERTICAL : FORMAS_HORIZONTAL;
    let h = 0;
    for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return formas[h % formas.length];
  }

  function agregarFotosAlGrid(fotos) {
    const grid = document.getElementById('masonryGrid');
    // Si entran fotos nuevas mientras alguien recorre la galería, las
    // tandas siguientes vienen corridas y repiten algunas: se saltean.
    fotos = fotos.filter(f => {
      if (idsEnGrilla.has(f.id)) return false;
      idsEnGrilla.add(f.id);
      return true;
    });
    const inicio = fotosCache.length;
    fotosCache = fotosCache.concat(fotos);
    fotos.forEach((foto, i) => {
      const globalIndex = inicio + i;
      const pin = document.createElement('div');
      pin.className = 'pin';
      pin.dataset.index = globalIndex;
      const img = document.createElement('img');
      img.alt = 'Foto del casamiento';
      // En la grilla va la miniatura (~600px, mucho más liviana); la foto
      // completa se pide recién en el lightbox. Las fotos sin miniatura
      // (subidas antes de que existieran) usan la original.
      const rutas = rutasDeFoto(foto, true);
      let iRuta = 0;
      img.dataset.src = rutas[0];
      img.addEventListener('load', () => {
        if (!pin.dataset.forma) pin.dataset.forma = formaDePin(foto.id, img.naturalWidth, img.naturalHeight);
        img.classList.add('ready');
        pin.classList.add('loaded');
        pin.style.minHeight = '';
        img.dataset.retries = '0';
      });
      // Si falla (cupo momentáneo, corte de red, lo que sea), el navegador
      // NO reintenta solo — sin esto la foto queda rota para siempre hasta
      // recargar la página. Reintenta con backoff exponencial (2s, 4s,
      // 8s...) hasta 5 veces, así una falla transitoria no deja agujeros
      // permanentes en la grilla.
      img.addEventListener('error', () => {
        // Primero se prueba la ruta siguiente, sin esperar. Recién cuando
        // fallaron todas entran los reintentos de siempre, desde la primera.
        if (iRuta < rutas.length - 1) {
          iRuta++;
          img.dataset.src = rutas[iRuta];
          img.src = rutas[iRuta];
          return;
        }
        const intentos = parseInt(img.dataset.retries || '0', 10);
        if (intentos >= 5) return;
        img.dataset.retries = String(intentos + 1);
        const espera = registrarFalloYCalcularEspera(intentos);
        setTimeout(() => {
          iRuta = 0;
          img.dataset.src = rutas[0];
          img.src = rutas[0];
        }, espera);
      });
      pin.appendChild(img);
      pin.addEventListener('click', () => openLightbox(globalIndex));
      grid.appendChild(pin);
      unloadObserver.observe(pin);
    });
    if (fotosCache.length >= totalFotos && scrollObserver) {
      scrollObserver.disconnect();
    }
  }

  // ---------- Lightbox ----------

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxSpinner = document.getElementById('lightbox-spinner');
  const lightboxCounter = document.getElementById('lightbox-counter');
  let lightboxIndex = 0;

  function openLightbox(index) {
    lightboxIndex = index;
    lightbox.classList.add('open');
    showLightboxPhoto();
  }

  // Si el usuario avanza (next) hasta el borde de lo que ya se trajo del
  // backend, se pide la página que sigue antes de mostrarla. prev/next se
  // mueven de a una foto (sin dar la vuelta) para no terminar pidiendo
  // cientos de páginas de golpe si alguien salta del principio al final
  // con una galería de miles de fotos.
  async function asegurarFotoCargada(index) {
    if (fotosCache.length <= index && fotosCache.length < totalFotos) {
      await renderNextPage();
    }
  }

  async function showLightboxPhoto() {
    await asegurarFotoCargada(lightboxIndex);
    const foto = fotosCache[lightboxIndex];
    if (!foto) return;
    lightboxCounter.textContent = `${lightboxIndex + 1} / ${totalFotos}`;
    lightboxImg.classList.add('hidden');
    lightboxSpinner.classList.remove('hidden');
    lightboxImg.onload = () => {
      lightboxImg.classList.remove('hidden');
      lightboxSpinner.classList.add('hidden');
    };
    const rutas = rutasDeFoto(foto, false);
    const indice = lightboxIndex;
    let iRuta = 0;
    lightboxImg.onerror = () => {
      if (indice !== lightboxIndex) return; // ya se pasó a otra foto
      if (iRuta < rutas.length - 1) {
        iRuta++;
        lightboxImg.src = rutas[iRuta];
        return;
      }
      lightboxSpinner.classList.add('hidden');
      showToast('No se pudo cargar la foto');
    };
    lightboxImg.src = rutas[0];
  }

  function closeLightbox() { lightbox.classList.remove('open'); }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.getElementById('lightbox-prev').addEventListener('click', () => {
    if (lightboxIndex <= 0) return;
    lightboxIndex--;
    showLightboxPhoto();
  });
  document.getElementById('lightbox-next').addEventListener('click', () => {
    if (lightboxIndex >= totalFotos - 1) return;
    lightboxIndex++;
    showLightboxPhoto();
  });
  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
    if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
  });

  document.getElementById('lightbox-download').addEventListener('click', () => {
    downloadFoto(fotosCache[lightboxIndex]);
  });

  // Se baja como blob porque el atributo download no aplica a URLs de
  // otro dominio (el Worker): sin esto el navegador abriría la foto en
  // vez de guardarla.
  async function downloadFoto(foto) {
    try {
      const res = await fetch(foto.download || foto.directo);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const ext = (blob.type || '').includes('webp') ? 'webp'
        : (blob.type || '').includes('png') ? 'png' : 'jpg';
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'foto-casamiento.' + ext;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    } catch (err) {
      showToast('No se pudo descargar la foto');
    }
  }

  // ---------- Subida ----------

  // Detección de soporte de WebP en <canvas>.toBlob(): si el navegador no
  // sabe codificar WebP, produce igual un blob pero con otro `type` (o
  // ninguno) — en ese caso se cae a JPEG. Se resuelve una sola vez al
  // cargar la página.
  let outputMime = 'image/jpeg';
  (function detectWebpSupport() {
    const c = document.createElement('canvas');
    c.width = 1;
    c.height = 1;
    c.toBlob((blob) => {
      if (blob && blob.type === 'image/webp') outputMime = 'image/webp';
    }, 'image/webp');
  })();

  // ---------- Fotos HEIC (iPhone) ----------
  // Chrome, Firefox y Edge no saben abrir HEIC: el <img> de resizeImage()
  // falla y la foto nunca se sube. En el celular casi no pasa (el selector
  // del iPhone ya entrega JPEG), pero sí al subir desde una compu archivos
  // pasados del iPhone. En ese caso se convierte a JPEG con heic2any, que
  // pesa ~1,3 MB y por eso se carga solo cuando hace falta.
  const HEIC2ANY_URL = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
  let heic2anyPromesa = null;

  function esHeic(file) {
    return /image\/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');
  }

  function cargarHeic2any() {
    if (!heic2anyPromesa) {
      heic2anyPromesa = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = HEIC2ANY_URL;
        script.onload = () => resolve(window.heic2any);
        script.onerror = () => { heic2anyPromesa = null; reject(new Error('No se pudo cargar el conversor HEIC')); };
        document.head.appendChild(script);
      });
    }
    return heic2anyPromesa;
  }

  // Conversor principal: heic-to (libheif reciente, ~3 MB, se carga solo si
  // hace falta). Lo anterior, heic2any, usa una libheif vieja que falla con
  // "ERR_LIBHEIF format not supported" en fotos de iPhone recientes; queda
  // de respaldo.
  const HEICTO_URL = 'https://cdn.jsdelivr.net/npm/heic-to@1.6.6/dist/iife/heic-to.js';
  let heicToPromesa = null;

  function cargarHeicTo() {
    if (!heicToPromesa) {
      heicToPromesa = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = HEICTO_URL;
        script.onload = () => resolve(window.HeicTo);
        script.onerror = () => { heicToPromesa = null; reject(new Error('No se pudo cargar el conversor HEIC')); };
        document.head.appendChild(script);
      });
    }
    return heicToPromesa;
  }

  // HEIC → JPEG probando un conversor y, si falla, el otro.
  async function convertirHeic(file, calidad) {
    try {
      const heicTo = await cargarHeicTo();
      return await heicTo({ blob: file, type: 'image/jpeg', quality: calidad });
    } catch (err) {
      log('heic-to no pudo convertirla, se prueba heic2any:', err);
    }
    const heic2any = await cargarHeic2any();
    const convertido = await heic2any({ blob: file, toType: 'image/jpeg', quality: calidad });
    return Array.isArray(convertido) ? convertido[0] : convertido;
  }

  function sePuedeAbrir(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(true); };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(false); };
      img.src = url;
    });
  }

  // Devuelve algo que el navegador pueda dibujar: el mismo archivo o, si
  // es un HEIC que no sabe abrir, su conversión a JPEG.
  async function archivoDibujable(file) {
    if (!esHeic(file) || await sePuedeAbrir(file)) return file;
    return convertirHeic(file, 0.9);
  }

  function resizeImage(file, maxDim, calidad) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            } else {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => resolve(blob), outputMime, calidad || 0.85);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- Cola local (IndexedDB): guarda la foto hasta confirmar la subida ----------
  // Mismo patrón que mensaje/index.html: la foto se resguarda localmente
  // antes de subirse y recién se borra de la cola cuando el servidor
  // confirma la subida. Si no hay conexión, queda pendiente y se
  // reintenta solo al reconectar (o cada 30s).

  const DB_NAME = 'galeria-casamiento';
  const STORE_NAME = 'pendientes';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function savePending(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getAllPending() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function deletePending(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function uploadRecord(record) {
    // Va como archivo (FormData), sin pasar a base64: un tercio menos de
    // datos por el wifi del salón.
    const form = new FormData();
    form.append('foto', new File([record.blob], record.nombre, { type: record.mimeType }));
    if (record.thumb) form.append('thumb', record.thumb, 'thumb');
    form.append('nombre', record.nombre);
    if (record.hash) form.append('hash', record.hash);
    // Con tiempo límite: si la conexión se cuelga a mitad de camino, la
    // cola no puede quedar "subiendo" (y los botones deshabilitados) para
    // siempre.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), SUBIDA_TIMEOUT_MS);
    let res;
    const t0 = performance.now();
    log('Subiendo', record.nombre, Math.round(record.blob.size / 1024) + ' KB →', MEDIA_URL + '/fotos');
    try {
      res = await fetch(MEDIA_URL + '/fotos', { method: 'POST', body: form, signal: controller.signal });
    } catch (err) {
      log('  FALLÓ el pedido (sin respuesta):', err, '· online:', navigator.onLine);
      throw err;
    } finally {
      clearTimeout(timer);
    }
    log('  respuesta HTTP', res.status, 'en', Math.round(performance.now() - t0), 'ms');
    // 400/413/415: el Worker rechazó esta foto en sí (formato o tamaño).
    // Reintentarla no sirve y, como la cola va en orden, trabaría a todas
    // las que vienen detrás.
    if ([400, 413, 415].includes(res.status)) throw new FotoRechazada(res.status);
    if (res.status === 409) throw new FotoRepetida();
    const data = await res.json();
    log('  cuerpo:', data);
    if (!data.success) throw new Error('El servidor no confirmó la subida');
    registrarSubidaPropia(data.id, record);
  }

  const SUBIDA_TIMEOUT_MS = 90 * 1000;

  class FotoRechazada extends Error {
    constructor(status) { super('Foto rechazada (' + status + ')'); }
  }

  // La foto ya está en la galería (el Worker la reconoce por la huella).
  class FotoRepetida extends Error {}

  // SHA-256 del archivo original, el que eligió el invitado: el mismo
  // archivo da siempre la misma huella aunque la conversión a WebP no
  // salga byte por byte igual. Una copia reenviada por WhatsApp o editada
  // es otro archivo y no se detecta. Si el navegador no puede calcularla
  // (crypto.subtle pide https), la foto se sube sin control.
  async function huellaArchivo(file) {
    try {
      const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
    } catch (err) {
      return null;
    }
  }

  let uploadingQueue = false;
  async function tryUploadPending() {
    if (uploadingQueue || !navigator.onLine) return;
    uploadingQueue = true;
    const btn = document.getElementById('uploadBtn');
    const camBtn = document.getElementById('cameraBtn');
    const pill = document.getElementById('uploadPill');
    let subidas = 0;
    let rechazadas = 0;
    let repetidas = 0;
    try {
      const pending = await getAllPending();
      if (!pending.length) return;
      log('Cola: hay', pending.length, 'foto(s) esperando para subir');
      btn.disabled = true;
      btn.classList.add('busy');
      camBtn.disabled = true;
      pill.classList.add('show');
      for (let i = 0; i < pending.length; i++) {
        pill.textContent = `Subiendo ${i + 1} de ${pending.length}...`;
        try {
          await uploadRecord(pending[i]);
          await deletePending(pending[i].id);
          subidas++;
        } catch (err) {
          if (err instanceof FotoRepetida) {
            log('  el Worker dice que esa foto ya estaba: se saca de la cola');
            await deletePending(pending[i].id);
            repetidas++;
            continue;
          }
          if (err instanceof FotoRechazada) {
            log('  el Worker rechazó la foto (formato o tamaño):', err);
            console.error('Foto rechazada por el servidor', pending[i].nombre, err);
            await deletePending(pending[i].id);
            rechazadas++;
            continue;
          }
          log('  la cola se corta acá, se reintenta en 30 s:', err);
          break; // probablemente se cortó la conexión de nuevo; se reintenta más tarde
        }
      }
    } catch (err) {
      log('Cola: no se pudo leer IndexedDB:', err);
      // IndexedDB no disponible o falló la lectura; se reintenta en el próximo trigger
    } finally {
      uploadingQueue = false;
      btn.disabled = false;
      btn.classList.remove('busy');
      camBtn.disabled = false;
      pill.classList.remove('show');
      if (subidas > 0) {
        showToast(`📸 ${subidas} foto${subidas > 1 ? 's' : ''} subida${subidas > 1 ? 's' : ''}`);
        loadGaleria();
      }
      if (repetidas > 0) {
        showToast(repetidas > 1
          ? `${repetidas} fotos ya estaban en la galería y no se repitieron`
          : 'Esa foto ya estaba en la galería');
      }
      if (rechazadas > 0) {
        showToast(rechazadas > 1
          ? `${rechazadas} fotos no se pudieron subir (formato o tamaño no admitido)`
          : 'Una foto no se pudo subir (formato o tamaño no admitido)');
      }
    }
  }

  window.addEventListener('online', tryUploadPending);
  setInterval(tryUploadPending, 30000);
  tryUploadPending();

  async function handleFiles(fileList) {
    // Algunos navegadores entregan los HEIC con type vacío: se miran
    // también por la extensión.
    const todos = Array.from(fileList);
    log('Elegidos', todos.length, 'archivos:', todos.map(f => `${f.name} (${f.type || 'sin tipo'}, ${Math.round(f.size / 1024)} KB)`));
    const files = todos.filter(f => f.type.startsWith('image/') || esHeic(f));
    if (files.length < todos.length) log('Descartados por no ser imagen:', todos.length - files.length);
    if (!files.length) return;

    const input = document.getElementById('photoInput');
    let guardadas = 0;
    let fallidas = 0;
    let repetidasEnTanda = 0;
    // Huellas de lo que ya está esperando en la cola de este dispositivo,
    // para no encolar dos veces el mismo archivo (p. ej. elegirlo de nuevo
    // mientras no hay señal). Contra lo ya subido controla el Worker.
    let huellasEnCola = new Set();
    try { huellasEnCola = new Set((await getAllPending()).map(r => r.hash).filter(Boolean)); } catch (err) {}
    const hayHeic = files.some(esHeic);
    if (hayHeic) showToast('Preparando fotos del iPhone…');
    for (let i = 0; i < files.length; i++) {
      try {
        log(`[${i + 1}/${files.length}] ${files[i].name}: calculando huella…`);
        const hash = await huellaArchivo(files[i]);
        log(`[${i + 1}/${files.length}] huella:`, hash ? hash.slice(0, 12) + '…' : 'no disponible (se sube sin control de repetidas)');
        if (hash && huellasEnCola.has(hash)) { log('  ya está en la cola de este dispositivo, se saltea'); repetidasEnTanda++; continue; }
        if (hash) huellasEnCola.add(hash);
        const fuente = await archivoDibujable(files[i]);
        if (fuente !== files[i]) log('  convertida de HEIC a', fuente.type, Math.round(fuente.size / 1024) + ' KB');
        const resized = await resizeImage(fuente, MAX_DIM);
        log('  achicada:', resized.type, Math.round(resized.size / 1024) + ' KB');
        // La miniatura es un extra: si no se puede generar, la foto se
        // sube igual y la grilla usa la original.
        let thumb = null;
        try { thumb = await resizeImage(fuente, THUMB_DIM, 0.75); } catch (err) {}
        const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${i}`;
        await savePending({ id, blob: resized, thumb, hash, nombre: files[i].name, mimeType: outputMime, createdAt: Date.now() });
        log('  guardada en la cola del dispositivo, miniatura:', thumb ? Math.round(thumb.size / 1024) + ' KB' : 'no');
        guardadas++;
      } catch (err) {
        log('  ERROR preparando', files[i].name + ':', err && err.message ? err : String(err && err.type || err), '(si dice "error" a secas, el navegador no pudo abrir la imagen)');
        console.error('Error preparando foto', files[i].name, err);
        fallidas++;
      }
    }
    input.value = '';
    if (repetidasEnTanda && !guardadas && !fallidas) {
      showToast(repetidasEnTanda > 1 ? 'Esas fotos ya se están subiendo' : 'Esa foto ya se está subiendo');
      return;
    }
    if (fallidas && guardadas) {
      showToast(fallidas > 1
        ? `${fallidas} fotos no se pudieron abrir; las demás se suben igual`
        : 'Una foto no se pudo abrir; las demás se suben igual');
    }

    if (guardadas > 0) {
      if (!navigator.onLine) {
        showToast(guardadas > 1
          ? `${guardadas} fotos guardadas, se subirán cuando haya conexión`
          : 'Foto guardada, se subirá cuando haya conexión');
      }
      tryUploadPending();
    } else {
      showToast('No se pudo procesar la foto, reintentá');
    }
  }

  document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', (e) => handleFiles(e.target.files));

  document.getElementById('cameraBtn').addEventListener('click', () => document.getElementById('cameraInput').click());
  document.getElementById('cameraInput').addEventListener('change', (e) => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // El botón de cámara deja de mostrarse el día después de la boda: ya no
  // tiene sentido invitar a "sacar una foto ahora" pasado ese momento.
  // Subir desde la galería del dispositivo sigue disponible sin límite.
  (function ocultarCamaraTrasLaBoda() {
    const finCamara = new Date(2027, 9, 24, 10, 0, 0);
    if (new Date() >= finCamara) {
      document.getElementById('cameraBtn').classList.add('hidden');
      document.getElementById('uploadBtn').classList.add('solo');
    }
  })();
</script>
</body>
