<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julieta & Gabriel — Galería de fotos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

  @font-face {
    font-family: 'Edwardian Script ITC';
    src: url('../fonts/Edwardian.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --olive: #4b5320;
    --olive-dark: #3a4118;
    --cream: #f9f8ec;
    --bg: #eeecd4;
    --border: #ddd9ae;
    --muted: #8a8757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    font-family: 'Cormorant Garamond', serif;
    color: #3f3e28;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  /* ---------- Header ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--olive);
    color: var(--cream);
    padding: max(16px, env(safe-area-inset-top)) 18px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.14);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
    text-decoration: none;
  }
  .icon-btn:active { background: rgba(255,255,255,0.28); }
  .icon-btn svg { width: 18px; height: 18px; }
  .topbar-title { flex: 1; min-width: 0; }
  .topbar-title .kicker { font-style: italic; font-size: 14px; opacity: 0.85; line-height: 1; }
  .topbar-title h1 {
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .count-badge {
    background: rgba(255,255,255,0.16);
    color: var(--cream);
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .content {
    max-width: 1500px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 10px calc(100px + env(safe-area-inset-bottom));
  }
  .intro { text-align: center; color: var(--muted); font-size: 17px; margin-bottom: 18px; }

  /* ---------- Masonry (estilo Pinterest) ---------- */

  .masonry {
    column-count: 2;
    column-gap: 8px;
  }
  @media (min-width: 560px)  { .masonry { column-count: 3; } }
  @media (min-width: 860px)  { .masonry { column-count: 4; } }
  @media (min-width: 1180px) { .masonry { column-count: 5; } }
  @media (min-width: 1500px) { .masonry { column-count: 6; } }

  .pin {
    break-inside: avoid;
    margin-bottom: 8px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(100deg, #ece9cf 30%, #f5f3e2 50%, #ece9cf 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    cursor: pointer;
    min-height: 160px;
  }
  .pin:nth-child(3n)   { min-height: 220px; }
  .pin:nth-child(5n+1) { min-height: 280px; }
  .pin.loaded { animation: none; background: #f2f1de; min-height: 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .pin img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .pin img.ready { opacity: 1; }

  #scrollSentinel { height: 1px; }

  .state-msg {
    text-align: center;
    color: var(--muted);
    padding: 50px 10px;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .state-msg svg { width: 42px; height: 42px; color: var(--border); }

  /* ---------- FAB ---------- */

  .fab {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--olive);
    color: var(--cream);
    border: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .fab:active { background: var(--olive-dark); transform: scale(0.94); }
  .fab svg { width: 26px; height: 26px; }
  .fab.busy svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fab-upload {
    bottom: calc(110px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
  }
  .fab-upload.solo {
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
  }

  .fab-camera {
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    width: 78px;
    height: 78px;
  }
  .fab-camera svg { width: 34px; height: 34px; }

  .upload-pill {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(178px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    background: #2e2c18;
    color: var(--cream);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 10;
  }
  .upload-pill.show { opacity: 1; transform: translateY(0); }

  /* ---------- Lightbox ---------- */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,9,2,0.94);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: min(92vw, 900px);
    max-height: 78vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox-top {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    left: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lightbox-counter { color: var(--cream); font-size: 15px; opacity: 0.85; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: var(--cream);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lightbox-nav:active { background: rgba(255,255,255,0.24); }
  .lightbox-nav svg { width: 20px; height: 20px; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-bottom {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
  }
  .lightbox-download {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    color: var(--olive);
    padding: 11px 22px;
    border-radius: 30px;
    border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .lightbox-download svg { width: 17px; height: 17px; }
  .lightbox-spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--cream);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom) + var(--vv-gap, 0px));
    transform: translateX(-50%) translateY(20px);
    background: #2e2c18;
    color: var(--cream);
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="topbar">
    <a class="icon-btn" href="../index.html" id="backLink" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title">
      <span class="kicker">Julieta &amp; Gabriel</span>
      <h1>Galería</h1>
    </div>
    <span class="count-badge hidden" id="count-badge">0</span>
  </div>

  <div class="content">
    <p class="intro">Subí tus fotos y mirá las que van subiendo los demás invitados</p>
    <div class="state-msg hidden" id="stateMsg"></div>
    <div class="masonry" id="masonryGrid"></div>
    <div id="scrollSentinel"></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
  <div class="upload-pill" id="uploadPill"></div>
  <button class="fab fab-camera" id="cameraBtn" aria-label="Sacar foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <button class="fab fab-upload" id="uploadBtn" aria-label="Subir fotos desde la galería">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  </button>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-top">
      <span class="lightbox-counter" id="lightbox-counter"></span>
      <button class="icon-btn" id="lightbox-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img id="lightbox-img" alt="Foto del casamiento">
    <div class="lightbox-spinner hidden" id="lightbox-spinner"></div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lightbox-bottom">
      <button class="lightbox-download" id="lightbox-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-sc2l5jW1oMN6Dkr-s3gduTSbTTlL2gRiPlw_khEQ6GzTCkJHlnqpgvrvD0b2sBOo/exec";
  const MAX_DIM = 1600;
  const PAGE_SIZE = 16;

  // Safari en iOS reserva una barra de navegación pegada abajo que
  // aparece/desaparece con el scroll. env(safe-area-inset-bottom) no la
  // contempla (solo el "home indicator"), así que los botones flotantes
  // (position: fixed) pueden terminar tapados detrás de esa barra. Acá se
  // mide la diferencia entre el alto real de la ventana y el del visual
  // viewport (lo que Safari realmente muestra) y se empuja todo lo fijo
  // hacia arriba esa diferencia mediante la variable CSS --vv-gap.
  (function ajustarBotonesSobreBarraDeSafari() {
    if (!window.visualViewport) return;
    const raiz = document.documentElement;
    function actualizar() {
      const gap = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
      raiz.style.setProperty('--vv-gap', Math.max(0, Math.round(gap)) + 'px');
    }
    window.visualViewport.addEventListener('resize', actualizar);
    window.visualViewport.addEventListener('scroll', actualizar);
    actualizar();
  })();

  // Si se llegó navegando desde otra página del sitio (familiar/,
  // invitacion/, etc.), "Volver" usa el historial del navegador para
  // regresar exactamente ahí. Si no hay de dónde volver (URL pegada
  // directo, o vino de otro sitio), cae al ../index.html normal.
  document.getElementById('backLink').addEventListener('click', (e) => {
    if (document.referrer && document.referrer.startsWith(location.origin) && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  const countBadge = document.getElementById('count-badge');
  let fotosCache = [];       // fotos ya traídas del backend (crece de a páginas)
  let totalFotos = 0;        // total real informado por el backend (puede ser > fotosCache.length)
  let paginaSiguiente = 0;
  let cargandoPagina = false;
  let scrollObserver = null;
  let unloadObserver = null;

  // ---------- Freno global de reintentos ----------
  // Si fallan muchas fotos casi juntas (cupo agotado, bloqueo de Google,
  // etc.), NO conviene que cada una reintente sola — eso genera una
  // ráfaga sincronizada de pedidos automáticos contra el mismo recurso
  // caído, que es justo el patrón que hace que un bloqueo temporal se
  // mantenga o empeore. Este contador corta todos los reintentos por un
  // buen rato apenas se detecta ese patrón.
  let fallosRecientes = 0;
  let ultimoReinicioFallos = 0;
  let pausaGlobalHasta = 0;
  function registrarFalloYCalcularEspera(intentos) {
    const ahora = Date.now();
    if (ahora - ultimoReinicioFallos > 10000) {
      fallosRecientes = 0;
      ultimoReinicioFallos = ahora;
    }
    fallosRecientes++;
    if (fallosRecientes > 6) {
      pausaGlobalHasta = ahora + 3 * 60 * 1000; // 3 minutos sin insistir
    }
    const base = Math.min(2000 * 2 ** intentos, 30000);
    const conJitter = base * (0.5 + Math.random()); // 0.5x-1.5x: no todas caen a la vez
    return Math.max(conJitter, pausaGlobalHasta - ahora);
  }

  async function loadGaleria() {
    const stateMsg = document.getElementById('stateMsg');
    const grid = document.getElementById('masonryGrid');
    const sentinel = document.getElementById('scrollSentinel');
    const intro = document.querySelector('.intro');

    function showState(html) {
      stateMsg.innerHTML = html;
      stateMsg.classList.remove('hidden');
      grid.classList.add('hidden');
      sentinel.classList.add('hidden');
    }
    function showGrid() {
      stateMsg.classList.add('hidden');
      grid.classList.remove('hidden');
      sentinel.classList.remove('hidden');
    }

    try {
      const visRes = await fetch(GAS_URL + "?tipo=galeriaVisible");
      const visData = await visRes.json();
      if (visData.visible === false) {
        intro.classList.add('hidden');
        showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          <span>Seguí compartiendo tu enfoque sobre esta noche, mañana se revelará cada recuerdo subido por nuestros invitados.</span>`);
        countBadge.classList.add('hidden');
        fotosCache = [];
        totalFotos = 0;
        return;
      }
      intro.classList.remove('hidden');
    } catch (err) {}

    if (scrollObserver) scrollObserver.disconnect();
    if (unloadObserver) unloadObserver.disconnect();
    grid.innerHTML = '';
    fotosCache = [];
    totalFotos = 0;
    paginaSiguiente = 0;

    const primeraPagina = await pedirPagina(0);
    if (primeraPagina === null) {
      showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>No se pudieron cargar las fotos. Reintentá más tarde.</span>`);
      return;
    }
    if (!primeraPagina.total) {
      showState(`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Todavía no hay fotos. ¡Subí la primera!</span>`);
      countBadge.classList.add('hidden');
      return;
    }

    totalFotos = primeraPagina.total;
    countBadge.textContent = totalFotos;
    countBadge.classList.remove('hidden');
    showGrid();
    setupObservers();
    agregarFotosAlGrid(primeraPagina.fotos);
  }
  loadGaleria();

  // ---------- Scroll infinito + lazy loading + liberación de memoria ----------
  // Cada tanda de fotos se pide paginada al backend (liviano: solo
  // metadata) cuando el sentinel al pie de la grilla entra en pantalla.
  // Las <img> apuntan directo a la API oficial de Drive (foto.directo,
  // ver AppsScript_RSVP.gs), no al proxy de este script — así ver fotos
  // no gasta ejecuciones de Apps Script. El mismo observer, cuando una
  // foto ya cargada queda muy lejos por arriba del scroll, le limpia el
  // src para no acumular miles de imágenes decodificadas en memoria; si
  // el usuario vuelve a subir, se vuelve a pedir sola.

  async function pedirPagina(pagina) {
    try {
      const res = await fetch(GAS_URL + `?tipo=galeria&pagina=${pagina}&porPagina=${PAGE_SIZE}`);
      return await res.json();
    } catch (err) {
      console.error('No se pudo pedir la página de galería', err);
      return null;
    }
  }

  function setupObservers() {
    scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) renderNextPage();
      });
    }, { rootMargin: '600px 0px' });
    scrollObserver.observe(document.getElementById('scrollSentinel'));

    // rootMargin asimétrico: expande 600px hacia abajo (precarga antes de
    // que se note el salto) y 1500px hacia arriba (recién libera memoria
    // cuando quedó bastante lejos, no apenas sale de pantalla).
    unloadObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const pin = entry.target;
        const img = pin.querySelector('img');
        if (!img) return;
        if (entry.isIntersecting) {
          if (!img.src && img.dataset.src) img.src = img.dataset.src;
          return;
        }
        // No intersecta: solo nos importa "se fue por arriba, lejos" —
        // abajo no hay nada cargado todavía que valga la pena liberar.
        if (entry.boundingClientRect.bottom >= -1500) return;
        if (img.src) {
          pin.style.minHeight = entry.boundingClientRect.height + 'px';
          pin.classList.remove('loaded');
          img.removeAttribute('src');
          img.classList.remove('ready');
        }
      });
    }, { rootMargin: '1500px 0px 600px 0px' });
  }

  async function renderNextPage() {
    if (cargandoPagina || fotosCache.length >= totalFotos) return;
    cargandoPagina = true;
    const pagina = paginaSiguiente++;
    const data = await pedirPagina(pagina);
    cargandoPagina = false;
    if (!data || !data.fotos.length) return;
    agregarFotosAlGrid(data.fotos);
  }

  function agregarFotosAlGrid(fotos) {
    const grid = document.getElementById('masonryGrid');
    const inicio = fotosCache.length;
    fotosCache = fotosCache.concat(fotos);
    fotos.forEach((foto, i) => {
      const globalIndex = inicio + i;
      const pin = document.createElement('div');
      pin.className = 'pin';
      pin.dataset.index = globalIndex;
      const img = document.createElement('img');
      img.alt = 'Foto del casamiento';
      img.dataset.src = foto.directo;
      img.addEventListener('load', () => {
        img.classList.add('ready');
        pin.classList.add('loaded');
        pin.style.minHeight = '';
        img.dataset.retries = '0';
      });
      // Si falla (cupo momentáneo, corte de red, lo que sea), el navegador
      // NO reintenta solo — sin esto la foto queda rota para siempre hasta
      // recargar la página. Reintenta con backoff exponencial (2s, 4s,
      // 8s...) hasta 5 veces, así una falla transitoria no deja agujeros
      // permanentes en la grilla.
      img.addEventListener('error', () => {
        const intentos = parseInt(img.dataset.retries || '0', 10);
        if (intentos >= 5) return;
        img.dataset.retries = String(intentos + 1);
        const espera = registrarFalloYCalcularEspera(intentos);
        setTimeout(() => { img.src = img.dataset.src; }, espera);
      });
      pin.appendChild(img);
      pin.addEventListener('click', () => openLightbox(globalIndex));
      grid.appendChild(pin);
      unloadObserver.observe(pin);
    });
    if (fotosCache.length >= totalFotos && scrollObserver) {
      scrollObserver.disconnect();
    }
  }

  // ---------- Lightbox ----------

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxSpinner = document.getElementById('lightbox-spinner');
  const lightboxCounter = document.getElementById('lightbox-counter');
  let lightboxIndex = 0;

  function openLightbox(index) {
    lightboxIndex = index;
    lightbox.classList.add('open');
    showLightboxPhoto();
  }

  // Si el usuario avanza (next) hasta el borde de lo que ya se trajo del
  // backend, se pide la página que sigue antes de mostrarla. prev/next se
  // mueven de a una foto (sin dar la vuelta) para no terminar pidiendo
  // cientos de páginas de golpe si alguien salta del principio al final
  // con una galería de miles de fotos.
  async function asegurarFotoCargada(index) {
    if (fotosCache.length <= index && fotosCache.length < totalFotos) {
      await renderNextPage();
    }
  }

  async function showLightboxPhoto() {
    await asegurarFotoCargada(lightboxIndex);
    const foto = fotosCache[lightboxIndex];
    if (!foto) return;
    lightboxCounter.textContent = `${lightboxIndex + 1} / ${totalFotos}`;
    lightboxImg.classList.add('hidden');
    lightboxSpinner.classList.remove('hidden');
    lightboxImg.onload = () => {
      lightboxImg.classList.remove('hidden');
      lightboxSpinner.classList.add('hidden');
    };
    lightboxImg.onerror = () => showToast('No se pudo cargar la foto');
    lightboxImg.src = foto.directo;
  }

  function closeLightbox() { lightbox.classList.remove('open'); }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.getElementById('lightbox-prev').addEventListener('click', () => {
    if (lightboxIndex <= 0) return;
    lightboxIndex--;
    showLightboxPhoto();
  });
  document.getElementById('lightbox-next').addEventListener('click', () => {
    if (lightboxIndex >= totalFotos - 1) return;
    lightboxIndex++;
    showLightboxPhoto();
  });
  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
    if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
  });

  document.getElementById('lightbox-download').addEventListener('click', () => {
    downloadFoto(fotosCache[lightboxIndex].id);
  });

  async function downloadFoto(id) {
    try {
      const res = await fetch(GAS_URL + "?tipo=foto&id=" + id);
      const data = await res.json();
      const ext = (data.mimeType || '').includes('webp') ? 'webp'
        : (data.mimeType || '').includes('png') ? 'png' : 'jpg';
      const link = document.createElement('a');
      link.href = 'data:' + data.mimeType + ';base64,' + data.data;
      link.download = 'foto-casamiento.' + ext;
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch (err) {
      showToast('No se pudo descargar la foto');
    }
  }

  // ---------- Subida ----------

  // Detección de soporte de WebP en <canvas>.toBlob(): si el navegador no
  // sabe codificar WebP, produce igual un blob pero con otro `type` (o
  // ninguno) — en ese caso se cae a JPEG. Se resuelve una sola vez al
  // cargar la página.
  let outputMime = 'image/jpeg';
  (function detectWebpSupport() {
    const c = document.createElement('canvas');
    c.width = 1;
    c.height = 1;
    c.toBlob((blob) => {
      if (blob && blob.type === 'image/webp') outputMime = 'image/webp';
    }, 'image/webp');
  })();

  function resizeImage(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round(height * maxDim / width);
              width = maxDim;
            } else {
              width = Math.round(width * maxDim / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => resolve(blob), outputMime, 0.85);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
  }

  // ---------- Cola local (IndexedDB): guarda la foto hasta confirmar la subida ----------
  // Mismo patrón que mensaje/index.html: la foto se resguarda localmente
  // antes de subirse y recién se borra de la cola cuando el servidor
  // confirma la subida. Si no hay conexión, queda pendiente y se
  // reintenta solo al reconectar (o cada 30s).

  const DB_NAME = 'galeria-casamiento';
  const STORE_NAME = 'pendientes';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function savePending(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getAllPending() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function deletePending(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function uploadRecord(record) {
    const base64 = await blobToBase64(record.blob);
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ tipo: 'foto', nombre: record.nombre, mimeType: record.mimeType, data: base64 })
    });
    const data = await res.json();
    if (!data.success) throw new Error('El servidor no confirmó la subida');
  }

  let uploadingQueue = false;
  async function tryUploadPending() {
    if (uploadingQueue || !navigator.onLine) return;
    uploadingQueue = true;
    const btn = document.getElementById('uploadBtn');
    const camBtn = document.getElementById('cameraBtn');
    const pill = document.getElementById('uploadPill');
    let subidas = 0;
    try {
      const pending = await getAllPending();
      if (!pending.length) return;
      btn.disabled = true;
      btn.classList.add('busy');
      camBtn.disabled = true;
      pill.classList.add('show');
      for (let i = 0; i < pending.length; i++) {
        pill.textContent = `Subiendo ${i + 1} de ${pending.length}...`;
        try {
          await uploadRecord(pending[i]);
          await deletePending(pending[i].id);
          subidas++;
        } catch (err) {
          break; // probablemente se cortó la conexión de nuevo; se reintenta más tarde
        }
      }
    } catch (err) {
      // IndexedDB no disponible o falló la lectura; se reintenta en el próximo trigger
    } finally {
      uploadingQueue = false;
      btn.disabled = false;
      btn.classList.remove('busy');
      camBtn.disabled = false;
      pill.classList.remove('show');
      if (subidas > 0) {
        showToast(`📸 ${subidas} foto${subidas > 1 ? 's' : ''} subida${subidas > 1 ? 's' : ''}`);
        loadGaleria();
      }
    }
  }

  window.addEventListener('online', tryUploadPending);
  setInterval(tryUploadPending, 30000);
  tryUploadPending();

  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!files.length) return;

    const input = document.getElementById('photoInput');
    let guardadas = 0;
    for (let i = 0; i < files.length; i++) {
      try {
        const resized = await resizeImage(files[i], MAX_DIM);
        const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${i}`;
        await savePending({ id, blob: resized, nombre: files[i].name, mimeType: outputMime, createdAt: Date.now() });
        guardadas++;
      } catch (err) {
        console.error('Error preparando foto', err);
      }
    }
    input.value = '';

    if (guardadas > 0) {
      if (!navigator.onLine) {
        showToast(guardadas > 1
          ? `${guardadas} fotos guardadas, se subirán cuando haya conexión`
          : 'Foto guardada, se subirá cuando haya conexión');
      }
      tryUploadPending();
    } else {
      showToast('No se pudo procesar la foto, reintentá');
    }
  }

  document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', (e) => handleFiles(e.target.files));

  document.getElementById('cameraBtn').addEventListener('click', () => document.getElementById('cameraInput').click());
  document.getElementById('cameraInput').addEventListener('change', (e) => {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // El botón de cámara deja de mostrarse el día después de la boda: ya no
  // tiene sentido invitar a "sacar una foto ahora" pasado ese momento.
  // Subir desde la galería del dispositivo sigue disponible sin límite.
  (function ocultarCamaraTrasLaBoda() {
    const finCamara = new Date(2027, 9, 24, 10, 0, 0);
    if (new Date() >= finCamara) {
      document.getElementById('cameraBtn').classList.add('hidden');
      document.getElementById('uploadBtn').classList.add('solo');
    }
  })();
</script>
</body>
</html>
