<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julieta & Gabriel — Pantalla</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Special+Elite&display=swap');

  @font-face {
    font-family: 'Edwardian Script ITC';
    src: url('../fonts/Edwardian.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0b0a06;
    overflow: hidden;
    cursor: none;
    font-family: 'Cormorant Garamond', serif;
  }

  #stage { position: fixed; inset: 0; background: #0b0a06; }

  .slide-wrap {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.3s ease;
  }
  .slide-wrap.visible { opacity: 1; }

  .bg-blur {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(34px) brightness(0.5);
    transform: scale(1.15);
  }
  .fg {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
  }
  .fg.kenburns { animation: kenburns 7s ease-out forwards; }
  @keyframes kenburns {
    from { transform: scale(1); }
    to { transform: scale(1.07); }
  }

  video.fg { background: #000; z-index: 1; }

  .branding {
    position: fixed;
    left: 30px;
    bottom: 24px;
    font-family: 'Edwardian Script ITC', cursive;
    color: rgba(255,255,255,0.5);
    font-size: 38px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  .caption {
    position: fixed;
    right: 30px;
    bottom: 26px;
    color: rgba(255,255,255,0.55);
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .caption.visible { opacity: 1; }

  /* Pantalla inicial: mismo fondo claro con marco en relieve y mismas
     tipografías que la portada de la invitación y el Save the Date
     (Special Elite para el título y el botón, Edwardian para los nombres). */
  #start-overlay {
    position: fixed;
    inset: 0;
    background: #f1efe9 url('../img/fondoblancohorizontal.webp') center / cover no-repeat;
    color: #55543a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    z-index: 10;
    cursor: pointer;
  }
  #start-overlay h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-weight: normal;
    font-size: clamp(20px, 2.8vw, 34px);
    letter-spacing: clamp(4px, 0.6vw, 8px);
    text-transform: uppercase;
    color: #55543a;
    margin-bottom: clamp(18px, 3vh, 36px);
  }
  #start-overlay .nombres {
    font-family: 'Edwardian Script ITC', cursive;
    color: #4b5320;
    margin-bottom: clamp(26px, 4.5vh, 52px);
  }
  #start-overlay .nombres span {
    display: block;
    font-size: clamp(58px, 7.5vw, 130px);
    line-height: 1.15;
  }
  #start-overlay .nombres .amp {
    font-size: clamp(28px, 3.5vw, 56px);
    margin: 2px 0;
    color: #9c9a52;
  }
  #start-overlay .hint {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b6a45;
    padding: 14px 30px 11px;
    border: 1px solid rgba(85,84,58,0.55);
    border-radius: 30px;
    animation: pulseHint 1.8s ease-in-out infinite;
  }
  @keyframes pulseHint {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }

  #empty-msg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #d6d8ba;
    font-size: 22px;
    text-align: center;
    z-index: 4;
    padding: 20px;
  }
</style>
</head>
<body>

  <div id="stage"></div>
  <div class="branding">Julieta &amp; Gabriel</div>
  <div class="caption" id="caption">Mensaje de un invitado</div>
  <div id="empty-msg"></div>

  <div id="start-overlay">
    <h1>Nos casamos</h1>
    <div class="nombres">
      <span>Julieta</span>
      <span class="amp">&amp;</span>
      <span>Gabriel</span>
    </div>
    <p class="hint">Tocá para comenzar</p>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-sc2l5jW1oMN6Dkr-s3gduTSbTTlL2gRiPlw_khEQ6GzTCkJHlnqpgvrvD0b2sBOo/exec";
  const PHOTO_DURATION = 6500;
  const REFRESH_INTERVAL = 2 * 60 * 1000;
  const PRECARGA_ADELANTE = 3;
  const MODO = new URLSearchParams(location.search).get('modo'); // 'fotos' | 'videos' | null (ambos)

  const stage = document.getElementById('stage');
  const caption = document.getElementById('caption');
  const emptyMsg = document.getElementById('empty-msg');
  emptyMsg.innerHTML = MODO === 'fotos'
    ? 'Todavía no hay fotos para mostrar.<br>Van a empezar a aparecer apenas los invitados suban.'
    : MODO === 'videos'
      ? 'Todavía no hay mensajes para mostrar.<br>Van a empezar a aparecer apenas los invitados graben uno.'
      : 'Todavía no hay fotos ni mensajes para mostrar.<br>Van a empezar a aparecer apenas los invitados suban contenido.';

  let fotos = [];
  let mensajes = [];
  let playlist = [];
  let idx = 0;
  let cache = new Map();
  let lastRefresh = 0;
  let advanceTimer = null;

  function fetchConTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms || 15000);
    return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  function barajar(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function cargarDatos() {
    try {
      const [resF, resM] = await Promise.all([
        fetchConTimeout(GAS_URL + '?tipo=galeria', 15000),
        fetchConTimeout(GAS_URL + '?tipo=mensajes', 15000)
      ]);
      fotos = await resF.json();
      mensajes = await resM.json();
    } catch (err) {
      console.error('Error cargando datos', err);
    }
    lastRefresh = Date.now();
  }

  function construirPlaylist() {
    let todos;
    if (MODO === 'fotos') {
      todos = fotos.map(f => ({ type: 'foto', item: f }));
    } else if (MODO === 'videos') {
      todos = mensajes.map(m => ({ type: 'video', item: m }));
    } else {
      todos = [
        ...fotos.map(f => ({ type: 'foto', item: f })),
        ...mensajes.map(m => ({ type: 'video', item: m }))
      ];
    }
    return barajar(todos);
  }

  async function obtenerFoto(foto) {
    if (cache.has(foto.id)) return cache.get(foto.id);
    const res = await fetchConTimeout(foto.url, 15000);
    const data = await res.json();
    const url = 'data:' + data.mimeType + ';base64,' + data.data;
    cache.set(foto.id, url);
    return url;
  }

  // msg.directo apunta directo a la API de Drive (streaming real, sin
  // pasar por este script) — a diferencia de las fotos, un video no hace
  // falta bajarlo entero antes de mostrarlo: el <video> arranca a
  // reproducir progresivamente apenas tiene los primeros bytes. Si por
  // algún motivo no vino "directo" (p. ej. la Script Property de la key
  // no está configurada), cae al proxy de siempre.
  // La ruta directa puede quedar bloqueada por Google para toda una red
  // (HTTP 403 "Sorry...", ver bugs-conocidos.md). Cuando un video falla
  // por ahí se marca videoDirectoBloqueado y, de ahí en más, los videos
  // se piden por el proxy de este script (más lento: baja el video entero
  // en base64 antes de reproducir, pero no depende de esa ruta).
  let videoDirectoBloqueado = false;

  async function obtenerVideoPorProxy(msg) {
    if (cache.has(msg.id)) return cache.get(msg.id);
    const res = await fetchConTimeout(GAS_URL + '?tipo=mensajeVideo&id=' + msg.id, 25000);
    const data = await res.json();
    const url = 'data:' + data.mimeType + ';base64,' + data.data;
    cache.set(msg.id, url);
    return url;
  }

  async function obtenerVideo(msg) {
    if (msg.directo && !videoDirectoBloqueado) return msg.directo;
    return obtenerVideoPorProxy(msg);
  }

  function precargar(entry) {
    if (!entry) return Promise.resolve();
    return (entry.type === 'foto' ? obtenerFoto(entry.item) : obtenerVideo(entry.item)).catch(() => {});
  }

  // Las fotos sí conviene precargarlas en paralelo (son data-URIs pesadas
  // que hay que bajar enteras). Los videos con "directo" ya no lo
  // necesitan — el <video> los va bajando solo en streaming apenas se
  // muestran — así que esta función queda solo por si algún video cae al
  // proxy viejo (ver obtenerVideo()).
  function precargarTodosLosVideos(lista) {
    lista.forEach(entry => {
      if (entry.type === 'video' && (!entry.item.directo || videoDirectoBloqueado)) precargar(entry);
    });
  }

  function limpiarAnteriores() {
    const wraps = stage.querySelectorAll('.slide-wrap');
    if (wraps.length > 1) {
      setTimeout(() => {
        wraps.forEach((w, i) => { if (i < wraps.length - 1) w.remove(); });
      }, 1400);
    }
  }

  let watchdogTimer = null;
  function resetWatchdog() {
    clearTimeout(watchdogTimer);
    watchdogTimer = setTimeout(() => {
      console.warn('TV: sin avance en 45s, forzando recuperación');
      mostrarSiguiente();
    }, 45000);
  }

  async function mostrarSiguiente() {
    clearTimeout(advanceTimer);
    resetWatchdog();
    if (!playlist.length) {
      emptyMsg.style.display = 'flex';
      setTimeout(async () => { await cargarDatos(); playlist = construirPlaylist(); mostrarSiguiente(); }, 15000);
      return;
    }
    emptyMsg.style.display = 'none';

    if (idx >= playlist.length) {
      idx = 0;
      if (Date.now() - lastRefresh > REFRESH_INTERVAL) {
        await cargarDatos();
      }
      playlist = construirPlaylist();
      precargarTodosLosVideos(playlist);
    }

    const entry = playlist[idx];
    idx++;
    for (let ahead = 0; ahead < PRECARGA_ADELANTE; ahead++) {
      precargar(playlist[(idx + ahead) % playlist.length]);
    }

    const wrap = document.createElement('div');
    wrap.className = 'slide-wrap';

    if (entry.type === 'foto') {
      caption.classList.remove('visible');
      const url = await obtenerFoto(entry.item).catch(() => null);
      if (!url) { advanceTimer = setTimeout(mostrarSiguiente, 3000); return; }
      const bg = document.createElement('img');
      bg.className = 'bg-blur';
      bg.src = url;
      const fg = document.createElement('img');
      fg.className = 'fg kenburns';
      fg.src = url;
      wrap.appendChild(bg);
      wrap.appendChild(fg);
      stage.appendChild(wrap);
      requestAnimationFrame(() => wrap.classList.add('visible'));
      limpiarAnteriores();
      advanceTimer = setTimeout(mostrarSiguiente, PHOTO_DURATION);
    } else {
      const url = await obtenerVideo(entry.item).catch(() => null);
      if (!url) { advanceTimer = setTimeout(mostrarSiguiente, 3000); return; }
      const video = document.createElement('video');
      video.className = 'fg';
      video.src = url;
      video.playsInline = true;
      video.autoplay = true;
      wrap.appendChild(video);
      stage.appendChild(wrap);
      requestAnimationFrame(() => { wrap.classList.add('visible'); caption.classList.add('visible'); });
      limpiarAnteriores();
      video.addEventListener('ended', mostrarSiguiente);
      // Si el video no carga por la ruta directa, se reintenta una vez por
      // el proxy; si tampoco, se pasa al siguiente sin esperar al watchdog.
      let probandoProxy = false;
      video.addEventListener('error', async () => {
        clearTimeout(advanceTimer);
        if (probandoProxy || url !== entry.item.directo) {
          advanceTimer = setTimeout(mostrarSiguiente, 2000);
          return;
        }
        probandoProxy = true;
        videoDirectoBloqueado = true;
        const alternativa = await obtenerVideoPorProxy(entry.item).catch(() => null);
        if (!wrap.isConnected) return; // el watchdog ya pasó a otra cosa
        if (!alternativa) { advanceTimer = setTimeout(mostrarSiguiente, 1000); return; }
        resetWatchdog();
        video.src = alternativa;
        video.play().catch(() => { if (!video.error) advanceTimer = setTimeout(mostrarSiguiente, 5000); });
      });
      // Si play() falla porque el video no cargó, se encarga el 'error' de arriba.
      video.play().catch(() => { if (!video.error) advanceTimer = setTimeout(mostrarSiguiente, 5000); });
    }
  }

  let wakeLock = null;
  async function pedirWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (wakeLock !== null && document.visibilityState === 'visible') {
            wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
          }
        });
      }
    } catch (err) {}
  }

  document.getElementById('start-overlay').addEventListener('click', function empezar() {
    const overlay = this;
    const hint = overlay.querySelector('.hint');
    hint.textContent = 'Cargando...';
    let arrancado = false;

    function arrancar() {
      if (arrancado) return;
      arrancado = true;
      clearTimeout(forzarInicio);
      overlay.style.display = 'none';
      mostrarSiguiente();
    }

    // Red de seguridad: pase lo que pase (permiso de pantalla completa
    // colgado, red lenta, etc.), el slideshow arranca igual a los 20s.
    const forzarInicio = setTimeout(arrancar, 20000);

    document.documentElement.requestFullscreen?.().catch(() => {});
    pedirWakeLock();

    (async () => {
      await cargarDatos();
      playlist = construirPlaylist();
      idx = 0;
      if (playlist.length) {
        precargarTodosLosVideos(playlist);
        await Promise.all([
          precargar(playlist[0]),
          precargar(playlist[1 % playlist.length])
        ]);
      }
      arrancar();
    })();
  }, { once: true });
</script>
</body>
</html>
