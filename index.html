<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julieta & Gabriel — Nos casamos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

  @font-face {
    font-family: 'Edwardian Script ITC';
    src: url('fonts/Edwardian.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    background-color: #eeecd4;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(156,163,82,0.18), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(139,150,80,0.14), transparent 45%),
      radial-gradient(circle at 30% 90%, rgba(108,128,68,0.12), transparent 40%),
      linear-gradient(135deg, #f2f1de 0%, #e7e6c6 100%);
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', serif;
    color: #48472e;
    padding: 30px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  .hidden { display: none !important; }

  .bg-pattern {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  .wrap { max-width: 480px; width: 100%; position: relative; z-index: 1; }

  .card {
    background: #f9f8ec;
    border: 1px solid #c7c894;
    border-radius: 4px;
    padding: 50px 36px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.10);
    position: relative;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border: 1px solid #9c9a52;
  }
  .card::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .card::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .kicker {
    font-family: 'Edwardian Script ITC', cursive;
    font-weight: normal;
    font-size: 52px;
    color: #4b5320;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 17px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    color: #4b5320;
    margin-bottom: 2px;
  }
  .intro {
    font-family: 'Edwardian Script ITC', cursive;
    font-weight: normal;
    font-size: 26px;
    color: #71724a;
    margin-bottom: 20px;
  }

  .divider {
    width: 56px;
    height: 1px;
    background: #9c9a52;
    margin: 22px auto;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #c7c894;
    border-radius: 3px;
    background: #f6f5e6;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    color: #48472e;
    outline: none;
  }
  input[type="text"]:focus { border-color: #7d7a3f; }

  .guest-results { margin-top: 16px; text-align: left; }
  .guest-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid #dcdcb0;
    border-radius: 3px;
    margin-bottom: 8px;
    background: #f6f5e6;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .guest-item:hover { background: #eceed6; }
  .guest-item span { font-family: 'Edwardian Script ITC', cursive; font-weight: normal; font-size: 30px; }
  .no-results, .buscando { font-size: 15px; color: #7d7a3f; margin-top: 10px; }

  /* SOBRE DE APERTURA */
  .envelope {
    position: fixed;
    inset: 0;
    z-index: 100;
    background-image: url('img/sobre.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    overflow: hidden;
    transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease;
  }
  .envelope.open {
    opacity: 0;
    transform: scale(1.04);
    visibility: hidden;
    pointer-events: none;
  }
  .envelope-content {
    text-align: center;
    color: #fdf6ec;
    padding: 64px 24px 0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
  }
  .envelope-kicker {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f2f1de;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(14px);
    animation: envelopeTextIn 0.8s ease forwards;
    animation-delay: 0.4s;
  }
  .envelope-names {
    font-family: 'Edwardian Script ITC', cursive;
    font-weight: normal;
    font-size: 86px;
    line-height: 1.15;
    color: #fffdf6;
  }
  .envelope-name-part,
  .envelope-amp {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    animation: envelopeTextIn 0.7s ease forwards;
  }
  .envelope-names .envelope-name-part:first-child { animation-delay: 0.65s; }
  .envelope-names .envelope-amp {
    animation-delay: 0.95s;
    font-size: 0.5em;
    vertical-align: middle;
    margin: 0 8px;
  }
  .envelope-names .envelope-name-part:last-child { animation-delay: 1.25s; }
  .envelope-hint {
    margin-top: auto;
    margin-bottom: 42px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f2f1de;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(14px);
    animation: envelopeTextIn 0.8s ease forwards;
    animation-delay: 1.75s;
  }
  @keyframes envelopeTextIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* SAVE THE DATE */
  .std-wrap {
    position: fixed;
    inset: 0;
    background: #14130a;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(156,163,82,0.25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(108,128,68,0.2), transparent 45%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .std-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .std-start {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f2f1de;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .std-start .kicker {
    font-family: 'Edwardian Script ITC', cursive;
    font-size: clamp(48px, 10vw, 90px);
    margin-bottom: 14px;
    color: #f2f1de;
  }
  .std-start .std-sub {
    font-size: clamp(15px, 2vw, 20px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d6d8ba;
    margin-bottom: 40px;
  }
  .std-start .hint {
    font-size: clamp(13px, 1.5vw, 16px);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 13px 32px;
    border: 1px solid rgba(242,241,222,0.5);
    border-radius: 30px;
    animation: pulseHint 1.8s ease-in-out infinite;
  }
  @keyframes pulseHint {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="loadingGate"></div>

<!-- MODO: INVITACIÓN (sobre + buscador) -->
<div id="modoInvitacion" class="hidden">
  <div class="envelope" id="envelope">
    <div class="envelope-content">
      <div class="envelope-kicker">Nos casamos</div>
      <div class="envelope-names">
        <span class="envelope-name-part">Julieta</span>
        <span class="envelope-amp">&amp;</span>
        <span class="envelope-name-part">Gabriel</span>
      </div>
    </div>
    <div class="envelope-hint">Tocá para abrir la invitación</div>
  </div>

  <svg class="bg-pattern" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="floral" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
        <g stroke="#9c9a52" stroke-width="1.1" fill="none" opacity="0.35">
          <path d="M20 180 C 40 140, 30 100, 60 70 C 90 40, 130 50, 150 20" />
          <circle cx="60" cy="70" r="9" />
          <circle cx="150" cy="20" r="7" />
          <path d="M60 70 q 15 -10 25 5" />
          <path d="M150 20 q 12 -8 20 2" />
          <path d="M100 150 c 10 -20 30 -20 40 -5" />
          <circle cx="140" cy="140" r="5" />
          <path d="M10 40 q 20 15 15 35" />
          <circle cx="10" cy="40" r="4" />
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#floral)" />
  </svg>

  <div class="wrap">
    <div class="card reveal">
      <p class="kicker">Julieta &amp; Gabriel</p>
      <h1>Nos casamos</h1>
      <div class="divider"></div>
      <p class="intro">Buscá tu nombre para ver tu invitación</p>
      <input type="text" id="nameSearch" placeholder="Escribí tu nombre..." oninput="searchGuest()" autocomplete="off">
      <div class="guest-results" id="guestResults"></div>
    </div>
  </div>
</div>

<!-- MODO: SAVE THE DATE -->
<div id="modoSaveTheDate" class="hidden">
  <div class="std-wrap">
    <video class="std-video hidden" id="stdVideo" playsinline controls></video>
    <div class="std-start" id="stdStart">
      <p class="kicker">Julieta &amp; Gabriel</p>
      <p class="std-sub">Save the date</p>
      <p class="hint">Tocá para reproducir</p>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-sc2l5jW1oMN6Dkr-s3gduTSbTTlL2gRiPlw_khEQ6GzTCkJHlnqpgvrvD0b2sBOo/exec";

  // ---------- Modo Invitación (código existente) ----------

  let guestList = [];
  async function loadGuests() {
    try {
      const res = await fetch(GAS_URL);
      guestList = await res.json(); // [{ nombre, confirmado, tipo }, ...]
    } catch (err) {
      console.error('No se pudo conectar con la planilla', err);
    }
  }

  function searchGuest() {
    const query = document.getElementById('nameSearch').value.trim().toLowerCase();
    const resultsDiv = document.getElementById('guestResults');
    resultsDiv.innerHTML = "";
    if (query.length < 2) return;

    const matches = guestList.filter(g => g.nombre.toLowerCase().includes(query));
    if (matches.length === 0) {
      resultsDiv.innerHTML = '<div class="no-results">No encontramos tu nombre. Contactanos directamente.</div>';
      return;
    }
    matches.forEach(g => {
      const item = document.createElement('div');
      item.className = 'guest-item';
      item.innerHTML = `<span>${g.nombre}</span>`;
      item.onclick = () => irALaInvitacion(g);
      resultsDiv.appendChild(item);
    });
  }

  function irALaInvitacion(guest) {
    document.getElementById('guestResults').innerHTML = '<div class="buscando">Un momento…</div>';
    const destino = guest.tipo === 'Familiar' ? 'familiar/index.html' : 'invitacion/index.html';
    setTimeout(() => { window.location.href = destino; }, 300);
  }

  function initInvitacion() {
    document.getElementById('modoInvitacion').classList.remove('hidden');
    window.searchGuest = searchGuest;
    loadGuests();

    const envelope = document.getElementById('envelope');
    document.documentElement.style.overflow = 'hidden';
    envelope.addEventListener('click', () => {
      envelope.classList.add('open');
      document.documentElement.style.overflow = '';
      document.querySelector('.reveal').classList.add('visible');
    }, { once: true });
  }

  // ---------- Modo Save the Date ----------

  function initSaveTheDate() {
    document.getElementById('modoSaveTheDate').classList.remove('hidden');
    const overlay = document.getElementById('stdStart');
    const video = document.getElementById('stdVideo');

    overlay.addEventListener('click', async function empezar() {
      overlay.querySelector('.hint').textContent = 'Cargando...';
      try {
        const res = await fetch(GAS_URL + "?tipo=saveTheDate");
        const info = await res.json();
        if (!info.id) throw new Error('sin video');
        const res2 = await fetch(GAS_URL + "?tipo=foto&id=" + info.id);
        const data = await res2.json();
        video.src = 'data:' + data.mimeType + ';base64,' + data.data;
        video.classList.remove('hidden');
        overlay.classList.add('hidden');
        video.play();
      } catch (err) {
        overlay.querySelector('.hint').textContent = 'No se pudo cargar el video';
      }
    }, { once: true });
  }

  // ---------- Arranque: decide qué modo mostrar ----------

  async function iniciar() {
    let modo = 'invitacion';
    try {
      const res = await fetch(GAS_URL + "?tipo=modoIndex");
      const data = await res.json();
      if (['savethedate', 'invitacion', 'galeria'].includes(data.modo)) modo = data.modo;
    } catch (err) {}

    if (modo === 'galeria') {
      window.location.href = 'galeria/index.html';
      return;
    }

    document.getElementById('loadingGate').remove();
    if (modo === 'savethedate') {
      initSaveTheDate();
    } else {
      initInvitacion();
    }
  }
  iniciar();
</script>
</body>
</html>
